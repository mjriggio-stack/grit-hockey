const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
let pts_=[], grit_=[], colors_=[], names_=[], filtered=[];

const PAD={l:48,r:20,t:16,b:42};

function getY(d,ax){
  if(ax==='pts') return d[6];
  if(ax==='g') return d[4];
  if(ax==='a') return d[5];
  if(ax==='pts_pg') return d[7]>0?+(d[6]/d[7]).toFixed(3):0;
  if(ax==='g_pg') return d[7]>0?+(d[4]/d[7]).toFixed(3):0;
  return 0;
}

function quadColor(gz, y, ym){
  if(gz>=0 && y>=ym) return '#1D9E75';
  if(gz>=0 && y<ym)  return '#378ADD';
  if(gz<0  && y>=ym) return '#E24B4A';
  return '#B4B2A9';
}

function draw(){
  const ax=document.getElementById('yaxis').value;
  const pf=document.getElementById('posf').value;
  const gpMin=+document.getElementById('gpmin').value;

  filtered = RAW.filter(d=>{
    const isW = d[2]==='L'||d[2]==='R';
    const pm = pf===''||(pf==='C'&&d[2]==='C')||(pf==='W'&&isW);
    return pm && d[7]>=gpMin;
  });

  const yVals = filtered.map(d=>getY(d,ax));
  const yMed = [...yVals].sort((a,b)=>a-b)[Math.floor(yVals.length/2)];
  const gritVals = filtered.map(d=>d[3]);

  const W=canvas.offsetWidth; const H=420;
  canvas.width=W; canvas.height=H;
  const pw=W-PAD.l-PAD.r, ph=H-PAD.t-PAD.b;

  const gMin=Math.min(...gritVals)-0.15, gMax=Math.max(...gritVals)+0.15;
  const yMin=0, yMax=Math.max(...yVals)*1.05;

  function cx(g){return PAD.l+((g-gMin)/(gMax-gMin))*pw;}
  function cy(y){return PAD.t+ph-((y-yMin)/(yMax-yMin))*ph;}

  ctx.clearRect(0,0,W,H);

  // grid
  ctx.strokeStyle='rgba(128,128,128,0.12)'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=PAD.t+i*(ph/4);
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
  }
  for(let i=0;i<=6;i++){
    const x=PAD.l+i*(pw/6);
    ctx.beginPath(); ctx.moveTo(x,PAD.t); ctx.lineTo(x,H-PAD.b); ctx.stroke();
  }

  // quadrant lines
  const x0=cx(0), yq=cy(yMed);
  ctx.strokeStyle='rgba(128,128,128,0.35)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(x0,PAD.t); ctx.lineTo(x0,H-PAD.b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l,yq); ctx.lineTo(W-PAD.r,yq); ctx.stroke();
  ctx.setLineDash([]);

  // axes labels
  ctx.fillStyle='rgba(128,128,128,0.7)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('← lower GRIT    GRIT z-score    higher GRIT →', PAD.l+pw/2, H-6);
  ctx.save(); ctx.translate(12, PAD.t+ph/2); ctx.rotate(-Math.PI/2);
  const yLabel={pts:'Points',g:'Goals',a:'Assists',pts_pg:'Pts/GP',g_pg:'G/GP'};
  ctx.fillText(yLabel[ax], 0, 0); ctx.restore();

  // axis ticks
  ctx.fillStyle='rgba(128,128,128,0.7)'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  const gTicks=5;
  for(let i=0;i<=gTicks;i++){
    const gv=gMin+i*(gMax-gMin)/gTicks;
    ctx.fillText(gv.toFixed(1), cx(gv), H-PAD.b+12);
  }
  ctx.textAlign='right';
  const yTicks=4;
  for(let i=0;i<=yTicks;i++){
    const yv=yMin+i*(yMax-yMin)/yTicks;
    const disp = (ax==='pts_pg'||ax==='g_pg')?yv.toFixed(2):Math.round(yv);
    ctx.fillText(disp, PAD.l-6, cy(yv)+4);
  }

  // dots
  pts_=[]; grit_=[]; colors_=[]; names_=[];
  filtered.forEach((d,i)=>{
    const gv=d[3], yv=getY(d,ax);
    const col=quadColor(gv,yv,yMed);
    const px=cx(gv), py=cy(yv);
    ctx.beginPath();
    ctx.arc(px,py,4,0,Math.PI*2);
    ctx.fillStyle=col+'cc';
    ctx.fill();
    pts_.push(px); grit_.push(py); colors_.push(col); names_.push(d);
  });
}

canvas.addEventListener('mousemove', e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const scale=canvas.width/rect.width;
  let best=-1, bd=999;
  pts_.forEach((px,i)=>{
    const d=Math.hypot((px/scale)*scale/scale - mx, (grit_[i]/1)*1 - my*scale/scale);
    const dx=px-mx*scale, dy=grit_[i]-my*scale;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<bd){bd=dist;best=i;}
  });
  if(best>=0 && bd<20*scale){
    const d=names_[best];
    const ax=document.getElementById('yaxis').value;
    const yv=getY(d,ax);
    const yLabel={pts:'PTS',g:'G',a:'A',pts_pg:'Pts/GP',g_pg:'G/GP'};
    tip.style.display='block';
    tip.style.left=(e.clientX-rect.left+12)+'px';
    tip.style.top=(e.clientY-rect.top-10)+'px';
    tip.innerHTML=`<strong>${d[0]}</strong><br>${d[2]} · ${d[1]} · ${d[7]} GP<br>GRIT z: ${d[3].toFixed(2)}<br>${yLabel[ax]}: ${(ax==='pts_pg'||ax==='g_pg')?yv.toFixed(2):yv}<br>G: ${d[4]} · A: ${d[5]} · PTS: ${d[6]}`;
  } else {
    tip.style.display='none';
  }
});
canvas.addEventListener('mouseleave',()=>tip.style.display='none');

window.addEventListener('resize', draw);
draw();
</script>
