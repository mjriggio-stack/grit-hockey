<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earning Your Points — GRIT v3 · 2025-26</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:  #1D9E75;
    --blue:   #378ADD;
    --red:    #E24B4A;
    --gray:   #6B7280;
    --watch:  #F59E0B;
    --bg:     #0D1117;
    --surface:#161B22;
    --border: #30363D;
    --text:   #E6EDF3;
    --muted:  #8B949E;
    --ice:    #1C2733;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  header {
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 4vw, 36px);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--green);
  }

  .season-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    max-width: 560px;
    line-height: 1.5;
  }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  select, input[type=text] {
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 9px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  select:focus, input[type=text]:focus {
    border-color: var(--green);
  }

  input[type=text] { width: 160px; }

  .stats-bar {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .stat {
    font-size: 12px;
    color: var(--muted);
  }

  .stat strong { font-weight: 600; }
  .stat-green strong { color: var(--green); }
  .stat-watch  strong { color: var(--watch); }

  .chart-wrap {
    position: relative;
    width: 100%;
    background: var(--ice);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    cursor: crosshair;
  }

  #tip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 210px;
    line-height: 1.7;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  #tip .tip-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }

  #tip .tip-meta { color: var(--muted); font-size: 11px; }
  #tip .tip-stats { font-size: 12px; margin-top: 4px; }
  #tip .tip-traj {
    font-family: monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  #tip .watch-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--watch);
    border: 1px solid var(--watch);
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .leg-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .leg-watch {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--watch);
    flex-shrink: 0;
  }

  .watch-section {
    margin-top: 24px;
  }

  .section-head {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--watch);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .watch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }

  .watch-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    transition: border-color 0.15s;
  }

  .watch-card:hover { border-color: var(--watch); }

  .wc-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .wc-meta {
    font-size: 11px;
    color: var(--muted);
    margin: 2px 0 6px;
  }

  .wc-traj {
    display: flex;
    gap: 3px;
    margin-bottom: 6px;
  }

  .traj-sq {
    width: 20px; height: 20px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .wc-stats {
    font-size: 11px;
    color: var(--muted);
  }

  .wc-stats strong { color: var(--text); }

  .gap-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
  }

  .gap-close { background: rgba(29,158,117,0.2); color: var(--green); }
  .gap-far   { background: rgba(229,75,74,0.15); color: var(--red); }
</style>
</head>

const MED=36;
const QC={GREEN:'#1D9E75',BLUE:'#378ADD',RED:'#E24B4A',GRAY:'#6B7280'};
const TRAJ_COLORS={G:'#1D9E75',B:'#378ADD',R:'#E24B4A','—':'#30363D'};

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const tip=document.getElementById('tip');
const PAD={l:50,r:20,t:20,b:44};
let _pts=[],_grits=[],_data=[];

function getY(d,ax){return ax==='pts'?d[4]:ax==='g'?d[5]:d[6];}
function isW(p){return p==='L'||p==='R';}

function draw(){
  const ax=document.getElementById('yax').value;
  const pf=document.getElementById('posf').value;
  const sf=document.getElementById('showf').value;
  const q=document.getElementById('search').value.toLowerCase();

  _data=RAW.filter(d=>{
    if(d[2]==='D') return false;
    const pm=pf===''||(pf==='C'&&d[2]==='C')||(pf==='W'&&isW(d[2]));
    const sm=sf===''||(sf==='green'&&d[9]==='GREEN')||(sf==='watch'&&d[12]===1);
    const qm=q===''||d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q);
    return pm&&sm&&qm;
  });

  // dedup
  const seen=new Set(); _data=_data.filter(d=>{if(seen.has(d[0]))return false;seen.add(d[0]);return true;});

  const grn=_data.filter(d=>d[9]==='GREEN').length;
  const wl=_data.filter(d=>d[12]===1).length;
  document.getElementById('stats').innerHTML=
    `<span class="stat"><strong>${_data.length}</strong> forwards shown</span>`+
    `<span class="stat stat-green"><strong>${grn}</strong> earning their points</span>`+
    `<span class="stat stat-watch"><strong>${wl}</strong> on watch list</span>`+
    `<span class="stat">median pts cutoff: <strong>${MED}</strong></span>`;

  const W=canvas.offsetWidth,H=440;
  canvas.width=W; canvas.height=H;
  const pw=W-PAD.l-PAD.r,ph=H-PAD.t-PAD.b;

  const yVals=_data.map(d=>getY(d,ax));
  const gVals=_data.map(d=>d[3]);
  if(!gVals.length) return;
  const gMin=Math.min(...gVals)-0.2,gMax=Math.max(...gVals)+0.2;
  const yMax=Math.max(...yVals)*1.07;

  function cx(g){return PAD.l+(g-gMin)/(gMax-gMin)*pw;}
  function cy(y){return PAD.t+ph-(y/yMax)*ph;}

  ctx.clearRect(0,0,W,H);

  // grid
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){const y=PAD.t+i*ph/4;ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();}
  for(let i=0;i<=6;i++){const x=PAD.l+i*pw/6;ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,H-PAD.b);ctx.stroke();}

  // quadrant lines
  const x0=cx(0),yq=cy(MED);
  ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x0,PAD.t);ctx.lineTo(x0,H-PAD.b);ctx.stroke();
  ctx.beginPath();ctx.moveTo(PAD.l,yq);ctx.lineTo(W-PAD.r,yq);ctx.stroke();
  ctx.setLineDash([]);

  // quad labels
  ctx.font='bold 10px Barlow Condensed, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.textAlign='left';
  ctx.fillText('EARNING YOUR POINTS',x0+8,PAD.t+14);
  ctx.textAlign='right';
  ctx.fillText('PHYSICAL / LOW SCORING',x0-8,PAD.t+14);
  ctx.fillText('SCORER / LOW GRIT',x0-8,H-PAD.b-8);
  ctx.textAlign='left';
  ctx.fillText('BELOW AVG BOTH',x0+8,H-PAD.b-8);

  // axes
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='10px Barlow, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('← lower GRIT     GRIT z-score     higher GRIT →',PAD.l+pw/2,H-6);
  ctx.save(); ctx.translate(14,PAD.t+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText({pts:'Points',g:'Goals',a:'Assists'}[ax],0,0); ctx.restore();
  ctx.textAlign='right';
  for(let i=0;i<=4;i++){const yv=yMax*i/4;ctx.fillText(Math.round(yv),PAD.l-5,cy(yv)+4);}
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<=6;i++){const gv=gMin+i*(gMax-gMin)/6;ctx.fillText(gv.toFixed(1),cx(gv),H-PAD.b+14);}

  // dots
  _pts=[]; _grits=[];
  _data.forEach(d=>{
    const gv=d[3],yv=getY(d,ax);
    const px=cx(gv),py=cy(yv);
    const col=QC[d[9]];
    const isW=d[12]===1;
    if(isW){
      ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);
      ctx.strokeStyle='#F59E0B';ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(px,py,isW?4.5:4,0,Math.PI*2);
    ctx.fillStyle=col+(isW?'ff':'cc');ctx.fill();
    _pts.push(px);_grits.push(py);
  });
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const scale=canvas.width/rect.width;
  const mx=(e.clientX-rect.left)*scale,my=(e.clientY-rect.top)*scale;
  let best=-1,bd=9999;
  _pts.forEach((px,i)=>{const dist=Math.sqrt((px-mx)**2+(_grits[i]-my)**2);if(dist<bd){bd=dist;best=i;}});
  if(best>=0&&bd<20*scale){
    const d=_data[best];
    const ax=document.getElementById('yax').value;
    const yv=getY(d,ax);
    const ageStr=d[8]>0?` · Age ${d[8]}`:'';
    const watchBadge=d[12]?'<span class="watch-badge">Watch</span>':'';
    tip.style.display='block';
    tip.style.left=(e.clientX+16)+'px';
    tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML=
      `<div class="tip-name" style="color:${QC[d[9]]}">${d[0]}${watchBadge}</div>`+
      `<div class="tip-meta">${d[2]} · ${d[1]}${ageStr} · ${d[7]} GP</div>`+
      `<div class="tip-stats">GRIT z: <strong>${d[3].toFixed(2)}</strong> · ${ax.toUpperCase()}: <strong>${yv}</strong></div>`+
      `<div class="tip-stats">G: ${d[5]} · A: ${d[6]} · PTS: ${d[4]}</div>`+
      `<div class="tip-traj">${d[10]}</div>`;
  } else {
    tip.style.display='none';
  }
});
canvas.addEventListener('mouseleave',()=>tip.style.display='none');

function buildWatchSection(){
  const watch=RAW.filter(d=>d[12]===1&&d[2]!=='D');
  const seen=new Set();
  const uniq=watch.filter(d=>{if(seen.has(d[0]))return false;seen.add(d[0]);return true;});
  uniq.sort((a,b)=>b[3]-a[3]);

  const sq=s=>{
    const c=TRAJ_COLORS[s]||'#30363D';
    return `<span class="traj-sq" style="background:${c}">${s==='—'?'·':s}</span>`;
  };

  const gapClass=g=>g<=5?'gap-close':g<=15?'gap-close':'gap-far';

  const html=uniq.map(d=>{
    const gap=MED-d[4];
    const traj=d[10].split('').map(sq).join('');
    return `<div class="watch-card">
      <div class="wc-name">${d[0]}</div>
      <div class="wc-meta">${d[2]} · ${d[1]} · Age ${d[8]}</div>
      <div class="wc-traj">${traj}</div>
      <div class="wc-stats">
        GRIT z: <strong>${d[3].toFixed(2)}</strong> · 
        PTS: <strong>${d[4]}</strong>
        <span class="gap-badge ${gapClass(gap)}">gap: ${gap}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('watch-section').innerHTML=
    `<div class="section-head">Development Watch List — Age ≤ 25, Blue Quadrant (${uniq.length} players)</div>`+
    `<p style="font-size:12px;color:var(--muted);margin-bottom:12px;">High GRIT, positive trajectory, not yet scoring above median. Trajectory: 2020 → 2022 → 2023 → 2024 → 2025. Gap = points below the ${MED} pt median threshold.</p>`+
    `<div class="watch-grid">${html}</div>`;
}

window.addEventListener('resize',draw);
draw();
buildWatchSection();
</script>
