    --text:#E6EDF3; --muted:#8B949E;

  body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }

  .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { font-size: 12px; padding: 5px 14px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: transparent; color: var(--muted); }
  .tab.active { background: var(--surface); color: var(--text); font-weight: 600; border-color: var(--green); }
  .ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  select, input[type=text] { font-size: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; outline: none; }
  input[type=text] { width: 150px; }
  .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  .stats-bar strong { color: var(--text); }
  .chart-wrap { position: relative; background: #1C2733; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  canvas { display: block; width: 100%; cursor: crosshair; }
  #tip { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 12px; pointer-events: none; display: none; z-index: 100; max-width: 220px; line-height: 1.7; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .tip-name { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .tip-meta { font-size: 11px; color: var(--muted); }
  .tip-stats { margin-top: 4px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .leg { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .elev-section { margin-top: 24px; }
  .sec-head { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .elev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 8px; }
  .elev-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .elev-card:hover { border-color: var(--green); }
  .ec-name { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
  .ec-meta { font-size: 11px; color: var(--muted); margin: 2px 0 6px; }
  .ec-bars { display: flex; flex-direction: column; gap: 4px; }
  .bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .bar-label { width: 22px; color: var(--muted); }
  .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-val { width: 36px; text-align: right; color: var(--text); }
  .delta-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
  .pos-delta { background: rgba(29,158,117,.2); color: var(--green); }
  .neg-delta { background: rgba(229,75,74,.15); color: var(--red); }
</style>

  _drawn=RAW.filter(d=>{
    if(getField(d,'rs_gz')===null&&v.xKey==='rs_gz') return false;
    if(getField(d,'rs_gz')===null&&v.yKey==='rs_gz') return false;
    const nm=q===''||d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q);
    const tm=tf===''||d[1]===tf;
    const rm=rsf===''||d[11]===rsf;
    return nm&&tm&&rm;
  });

  // stats
  const grn=_drawn.filter(d=>d[12]==='GREEN').length;
  const elevs=_drawn.filter(d=>d[5]!==null&&d[5]>0.5).length;
  document.getElementById('sbar').innerHTML=
    `<span><strong>${_drawn.length}</strong> forwards</span>`+
    `<span style="color:#1D9E75"><strong>${grn}</strong> PO Green quad</span>`+
    `<span style="color:#F59E0B"><strong>${elevs}</strong> GRIT elevators (Δ>0.5)</span>`;

  const W=canvas.offsetWidth,H=420;
  canvas.width=W;canvas.height=H;
  const pw=W-PAD.l-PAD.r,ph=H-PAD.t-PAD.b;

  const xVals=_drawn.map(d=>getField(d,v.xKey)).filter(x=>x!==null);
  const yVals=_drawn.map(d=>getField(d,v.yKey)).filter(y=>y!==null);
  if(!xVals.length) return;

  const xMin=Math.min(...xVals)-(Math.max(...xVals)-Math.min(...xVals))*0.06;
  const xMax=Math.max(...xVals)+(Math.max(...xVals)-Math.min(...xVals))*0.06;
  const yMin=Math.min(...yVals)-(Math.max(...yVals)-Math.min(...yVals))*0.06;
  const yMax=Math.max(...yVals)+(Math.max(...yVals)-Math.min(...yVals))*0.06;

  function cx(x){return PAD.l+(x-xMin)/(xMax-xMin)*pw;}
  function cy(y){return PAD.t+ph-(y-yMin)/(yMax-yMin)*ph;}

  ctx.clearRect(0,0,W,H);

  // grid
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){const y=PAD.t+i*ph/4;ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();}
  for(let i=0;i<=5;i++){const x=PAD.l+i*pw/5;ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,H-PAD.b);ctx.stroke();}

  // zero lines if applicable
  if(xMin<0&&xMax>0){
    ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx(0),PAD.t);ctx.lineTo(cx(0),H-PAD.b);ctx.stroke();
    ctx.setLineDash([]);
  }
  if(yMin<0&&yMax>0){
    ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PAD.l,cy(0));ctx.lineTo(W-PAD.r,cy(0));ctx.stroke();
    ctx.setLineDash([]);
  }

  // diagonal reference for RS vs PO views
  if(v.xKey==='rs_gz'&&v.yKey==='po_gz'){
    const mn=Math.max(xMin,yMin),mx=Math.min(xMax,yMax);
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx(mn),cy(mn));ctx.lineTo(cx(mx),cy(mx));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText('RS = PO',cx((mn+mx)/2)+20,cy((mn+mx)/2)-8);
  }

  // axes
  const mc='rgba(255,255,255,0.35)';
  ctx.fillStyle=mc;ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText(v.xLabel,PAD.l+pw/2,H-5);
  ctx.save();ctx.translate(13,PAD.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(v.yLabel,0,0);ctx.restore();
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<=4;i++){const yv=yMin+i*(yMax-yMin)/4;ctx.fillText(Number.isInteger(yv)?Math.round(yv):yv.toFixed(1),PAD.l-4,cy(yv)+4);}
  ctx.textAlign='center';
  for(let i=0;i<=5;i++){const xv=xMin+i*(xMax-xMin)/5;ctx.fillText(Number.isInteger(xv)?Math.round(xv):xv.toFixed(1),cx(xv),H-PAD.b+14);}

  _px=[];_py=[];
  _drawn.forEach(d=>{
    const xv=getField(d,v.xKey),yv=getField(d,v.yKey);
    if(xv===null||yv===null){_px.push(null);_py.push(null);return;}
    const px=cx(xv),py=cy(yv);
    const col=QC[d[12]];
    const isRSGreen=d[11]==='GREEN';

    // RS Green players get a diamond marker
    if(isRSGreen){
      ctx.save();ctx.translate(px,py);ctx.rotate(Math.PI/4);
      ctx.fillStyle=col+'cc';
      ctx.fillRect(-4,-4,8,8);
      ctx.restore();
    } else {
      ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);
      ctx.fillStyle=col+'bb';ctx.fill();
    }
    _px.push(px);_py.push(py);
  });
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const scale=canvas.width/rect.width;
  const mx=(e.clientX-rect.left)*scale,my=(e.clientY-rect.top)*scale;
  let best=-1,bd=9999;
  _px.forEach((px,i)=>{if(px===null)return;const dist=Math.sqrt((px-mx)**2+(_py[i]-my)**2);if(dist<bd){bd=dist;best=i;}});
  if(best>=0&&bd<20*scale){
    const d=_drawn[best];
    const dStr=d[5]!==null?(d[5]>0?`<span style="color:#1D9E75">+${d[5].toFixed(2)}</span>`:`<span style="color:#E24B4A">${d[5].toFixed(2)}</span>`):'—';
    tip.style.display='block';
    tip.style.left=(e.clientX+16)+'px';
    tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML=
      `<div class="tip-name" style="color:${QC[d[12]]}">${d[0]}</div>`+
      `<div class="tip-meta">${d[2]} · ${d[1]} · ${d[13]>0?'Age '+d[13]:''} · PO ${d[10]} GP</div>`+
      `<div class="tip-stats">RS GRIT z: <strong>${d[3]!==null?d[3].toFixed(2):'—'}</strong> → PO: <strong>${d[4].toFixed(2)}</strong> Δ: ${dStr}</div>`+
      `<div class="tip-stats">RS: ${d[11]} quad · PO: ${d[12]} quad</div>`+
      `<div class="tip-stats">PO: G=${d[8]} A=${d[9]} PTS=${d[7]} | RS PTS=${d[6]}</div>`;
  } else tip.style.display='none';
});
canvas.addEventListener('mouseleave',()=>tip.style.display='none');

function buildElevators(){
  const elevators=RAW.filter(d=>d[5]!==null&&d[5]>=0.5&&d[3]!==null).sort((a,b)=>b[5]-a[5]);
  const droppers=RAW.filter(d=>d[5]!==null&&d[5]<=-0.5&&d[3]!==null).sort((a,b)=>a[5]-b[5]);

  function card(d){
    const maxGrit=4;
    const rsW=Math.max(2,Math.round(Math.abs(d[3])/maxGrit*80));
    const poW=Math.max(2,Math.round(Math.abs(d[4])/maxGrit*80));
    const dCls=d[5]>0?'pos-delta':'neg-delta';
    return `<div class="elev-card">
      <div class="ec-name" style="color:${QC[d[12]]}">${d[0]}</div>
      <div class="ec-meta">${d[2]} · ${d[1]} · RS: ${d[11]} · PO ${d[10]} GP</div>
      <div class="ec-bars">
        <div class="bar-row"><span class="bar-label">RS</span><div class="bar-track"><div class="bar-fill" style="width:${rsW}%;background:${QC[d[11]]}88"></div></div><span class="bar-val">${d[3].toFixed(2)}</span></div>
        <div class="bar-row"><span class="bar-label">PO</span><div class="bar-track"><div class="bar-fill" style="width:${poW}%;background:${QC[d[12]]}"></div></div><span class="bar-val">${d[4].toFixed(2)}</span></div>
      </div>
      <div style="margin-top:6px;font-size:11px;color:var(--muted)">Δ <span class="delta-badge ${dCls}">${d[5]>0?'+':''}${d[5].toFixed(2)}</span> · PO: G=${d[8]} A=${d[9]} PTS=${d[7]}</div>
    </div>`;
  }

  document.getElementById('elev').innerHTML=
    `<div class="elev-section">
      <div class="sec-head" style="color:#1D9E75">GRIT Elevators — Playoff GRIT z significantly higher than RS (Δ ≥ +0.5)</div>
      <div class="elev-grid">${elevators.slice(0,16).map(card).join('')}</div>
    </div>
    <div class="elev-section" style="margin-top:20px">
      <div class="sec-head" style="color:#E24B4A">GRIT Droppers — Playoff GRIT z significantly lower than RS (Δ ≤ −0.5)</div>
      <div class="elev-grid">${droppers.slice(0,12).map(card).join('')}</div>
    </div>`;
}

buildTabs(); buildTeamFilter(); buildElevators();
window.addEventListener('resize',draw);
draw();
</script>
